<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>He Married I'm Not Hungry - Final Illustrated Carousel</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f2e8;
        color: #2b2520;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 28px;
      }

      header {
        max-width: 1180px;
        margin: 0 auto 22px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 42px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .status {
        font-size: 13px;
        padding: 7px 10px;
        border: 1px solid #b9a98e;
        background: #fffaf0;
        border-radius: 6px;
        white-space: nowrap;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        display: grid;
        gap: 28px;
      }

      section {
        display: grid;
        gap: 12px;
      }

      h2 {
        margin: 0;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #746550;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
        align-items: start;
      }

      figure {
        margin: 0;
        display: grid;
        gap: 8px;
      }

      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 6px;
        box-shadow: 0 12px 30px rgba(45, 34, 21, 0.14);
        background: #eadfcd;
      }

      figcaption {
        font-size: 12px;
        color: #675d50;
        text-align: center;
      }

      @media (max-width: 860px) {
        body {
          padding: 18px;
        }

        header {
          align-items: start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>He Married "I'm Not Hungry"</h1>
      <div class="status">Final audit: PASS_WITH_NOTES</div>
    </header>
    <main>
      <section>
        <h2>Instagram Post 4:5</h2>
        <div class="grid">
          <figure><img src="final/slide-01.png" alt="Slide 1" /><figcaption>Slide 01</figcaption></figure>
          <figure><img src="final/slide-02.png" alt="Slide 2" /><figcaption>Slide 02</figcaption></figure>
          <figure><img src="final/slide-03.png" alt="Slide 3" /><figcaption>Slide 03</figcaption></figure>
          <figure><img src="final/slide-04.png" alt="Slide 4" /><figcaption>Slide 04</figcaption></figure>
          <figure><img src="final/slide-05.png" alt="Slide 5" /><figcaption>Slide 05</figcaption></figure>
        </div>
      </section>
      <section>
        <h2>Reels / Stories 9:16</h2>
        <div class="grid">
          <figure><img src="final-reels-stories/slide-01.png" alt="Story slide 1" /><figcaption>Slide 01</figcaption></figure>
          <figure><img src="final-reels-stories/slide-02.png" alt="Story slide 2" /><figcaption>Slide 02</figcaption></figure>
          <figure><img src="final-reels-stories/slide-03.png" alt="Story slide 3" /><figcaption>Slide 03</figcaption></figure>
          <figure><img src="final-reels-stories/slide-04.png" alt="Story slide 4" /><figcaption>Slide 04</figcaption></figure>
          <figure><img src="final-reels-stories/slide-05.png" alt="Story slide 5" /><figcaption>Slide 05</figcaption></figure>
        </div>
      </section>
    </main>
  </body>
</html>
